name: CI

on:
  push:
    branches: [main, production-ready]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
        env:
          CI: "true"

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api-tests:
    runs-on: ubuntu-latest
    needs: server
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017/chat-app-ci
      JWT_SECRET: ci-only-secret-0123456789abcdef
      PORT: "5200"
      AUTH_RATE_LIMIT: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run build
        working-directory: server
      - name: Start server
        working-directory: server
        run: |
          node dist/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5200/api/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Run Postman collection
        working-directory: server
        run: BASE_URL=http://localhost:5200 npm run test:postman
